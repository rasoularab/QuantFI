[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-option-pricing"
version = "0.1.0"
description = "Monte Carlo pricing of European options under Black-Scholes-Merton dynamics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
